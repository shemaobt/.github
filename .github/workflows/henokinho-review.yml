name: Henokinho Review (reusable)

# First-pass PR review in Henok's (@henokteixeira) style, posted as the
# Henokinho GitHub App. Called by each repo's own thin caller workflow.
#
# The review spec lives in this repo under henokinho/ — review-style.md (voice,
# lenses, calibration) plus one lens pack per stack. Editing it here changes the
# behaviour in every repo at once; that single source of truth is the point.
#
# Sibling of joaozinho-review.yml and deliberately a copy of its shape rather
# than a shared abstraction. Two things differ on purpose: Henokinho never
# approves and never blocks, and the prior-passes logic lives in a script under
# henokinho/scripts/ so it can be tested.

on:
  workflow_call:
    inputs:
      lens_pack:
        description: 'Lens pack basename under henokinho/lenses/ — python-fastapi | flutter-dart | react-ts'
        required: true
        type: string
      reviewer_login:
        description: 'Review requests for this login trigger the bot'
        required: false
        type: string
        default: henokteixeira
      label_name:
        # Additive by construction rather than by this default. A caller reaches
        # the label arm of the job's `if` only by putting `labeled` into its own
        # `on: pull_request: types:`, so a caller that has not behaves exactly as
        # it did before this input existed, whatever is written here. The default
        # is the bot's own name rather than an empty string because a caller that
        # does opt in and forgets to name a label would otherwise get a run that
        # starts, skips, and looks identical to the guard working.
        #
        # This name is written twice on purpose. Each opted-in caller repeats it
        # in a job-level `if` of its own, so that an unrelated label does not
        # spend an invocation of this workflow merely to be turned away here —
        # a cost that grows with every label a repository ever gains and that
        # nobody notices, because the outcome looks the same either way. Nothing
        # gates the two copies against each other, so each names the other:
        # change this default and change the callers' guard with it.
        description: 'A label of this name on a pull request triggers the bot, beside the review request and never instead of it'
        required: false
        type: string
        default: henokinho
      app_id:
        description: 'GitHub App ID for the Henokinho App'
        required: true
        type: string
      bot_login:
        # NOT derived from this file's name. GitHub builds the login from the
        # App's slug plus a [bot] suffix, and the App is called little-henok
        # while the workflow is called henokinho — the same split the Joãozinho
        # bot has, where the App is little-joao[bot]. Whoever adds the third bot
        # in this family: read the login off the App, never off the workflow.
        description: 'Login the App comments under — the App slug plus [bot], which is not this workflow name. App id 4706739, slug little-henok.'
        required: false
        type: string
        default: little-henok[bot]
      model:
        description: 'Claude model to review with'
        required: false
        type: string
        default: claude-opus-5
      max_turns:
        # 40 comes from measurement, not from a round number. The first real
        # run, shema-api#238, took 33 turns: the review was complete and
        # posted, and then the job failed for exceeding the cap of 30 — the
        # spend happened and the run went red anyway. Joãozinho's runs on the
        # same repo measured 25, 17, 28, 14, 21 and 31, so 30 was already tight
        # for the cheaper bot. Henokinho costs more turns because §0 makes it
        # verify each finding against the tree before asserting it; that is the
        # design, not waste. 40 clears the worst case actually observed with
        # room to spare, and is deliberately not 50 — the cap is also the
        # ceiling on what one pathological run can spend.
        description: 'Turn cap for the reviewer'
        required: false
        type: number
        default: 40
    secrets:
      app_private_key:
        description: 'Private key for the Henokinho GitHub App'
        required: true
      claude_code_oauth_token:
        description: 'Claude Code OAuth token'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    # Two ways to ask for this review, and both are decided here rather than in
    # the callers, so a caller cannot loosen either by copying it wrong.
    #
    # The first is the configured human reviewer being personally requested. A
    # team request leaves requested_reviewer null, so that arm is safely false
    # for one — the bot answers a person being asked, never a team.
    #
    # The second is a label, and it exists for the case the first cannot cover:
    # GitHub refuses a review request aimed at a pull request's own author —
    # `422 Review cannot be requested from pull request author` — so on a
    # repository where the stand-in's human opens the pull requests himself,
    # requested_reviewer can never carry his login and the first arm can never
    # fire. On a `labeled` event there is no requested_reviewer at all, which is
    # why the login test is scoped to its own arm instead of governing both.
    #
    # Draft and bot-authored pull requests are excluded on either way in.
    #
    # Every line below sits at one indentation on purpose. `>-` folds only
    # across lines indented alike; indent the inner clauses to read as nesting
    # and YAML keeps their newlines, and what reaches GitHub is a multi-line
    # expression rather than this one.
    if: >-
      (
      (github.event.action == 'review_requested' && github.event.requested_reviewer.login == inputs.reviewer_login)
      ||
      (github.event.action == 'labeled' && github.event.label.name == inputs.label_name)
      )
      && github.event.pull_request.draft == false
      && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Mint Henokinho App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout review spec
        uses: actions/checkout@v4
        with:
          repository: shemaobt/.github
          path: .henokinho-spec
          token: ${{ steps.app-token.outputs.token }}

      # Runs before anything reads the PR. A bot_login that is not this App's
      # disables the closed ledger silently, so this stops the job instead.
      - name: Check the bot login belongs to this App
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: bash .henokinho-spec/henokinho/scripts/check-bot-login.sh

      - name: Collect prior Henokinho passes
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEWS_JSON: .henokinho-state/reviews.json
          COMMENTS_JSON: .henokinho-state/comments.json
          DIGEST_OUT: .henokinho-state/prior-review.md
        run: |
          set -euo pipefail
          mkdir -p .henokinho-state
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate > "$REVIEWS_JSON"
          gh api "repos/$REPO/pulls/$PR/comments" --paginate > "$COMMENTS_JSON"
          bash .henokinho-spec/henokinho/scripts/collect-prior-passes.sh

      - name: Resolve lens pack
        id: spec
        shell: bash
        env:
          LENS_PACK: ${{ inputs.lens_pack }}
        run: |
          set -euo pipefail
          pack=".henokinho-spec/henokinho/lenses/${LENS_PACK}.md"
          if [ ! -f "$pack" ]; then
            echo "::error::Lens pack not found: $pack"
            ls -1 .henokinho-spec/henokinho/lenses/ || true
            exit 1
          fi

          # Point the reviewer at whichever agent guidelines file this repo uses.
          guidelines=""
          for f in CLAUDE.md AGENTS.md; do
            if [ -f "$f" ]; then
              guidelines="$f"
              break
            fi
          done

          # Across the five target repos these files run 101, 188, 288, 336 and
          # 3924 lines. Reading the 3924-line one before opening the diff burns
          # the turn budget and the review never happens. 500 is the threshold
          # because it clears all four small files untouched — nothing changes
          # for them — while staying under roughly 8k tokens, which a reviewer
          # can absorb and still have room to review. Only the outlier is made
          # to search instead of read.
          lines=0
          mode="none"
          if [ -n "$guidelines" ]; then
            lines=$(wc -l < "$guidelines" | tr -d ' ')
            if [ "$lines" -le 500 ]; then
              mode="full"
            else
              mode="search"
            fi
          else
            echo "::warning::No CLAUDE.md or AGENTS.md at the repo root; reviewing from the lens pack alone."
          fi
          {
            echo "pack=$pack"
            echo "guidelines=$guidelines"
            echo "guidelines_lines=$lines"
            echo "guidelines_mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
            AUTHOR: @${{ github.event.pull_request.user.login }}

            THIS PASS — these four values exist nowhere else. review-style.md
            states the convergence rules; only this workflow knows where in them
            you currently are:
              PASS NUMBER: ${{ steps.prior.outputs.pass_index }}
              HEAD SHAs YOU HAVE ALREADY REVIEWED HERE: ${{ steps.prior.outputs.passes }}
              LAST SHA YOU REVIEWED: ${{ steps.prior.outputs.last_sha }}
              HEAD UNCHANGED SINCE THAT PASS: ${{ steps.prior.outputs.head_unchanged }}

            You are Henokinho, the automated first-pass reviewer for this org. You
            run because @${{ inputs.reviewer_login }} was requested as a reviewer,
            or because the pull request was labelled `${{ inputs.label_name }}`.
            You go first so his own pass is cheaper. You do not replace it.

            READ THESE FILES IN FULL BEFORE REVIEWING ANYTHING. They are the spec,
            not background, and they are BINDING — they are not context to weigh
            against your own judgement, they decide what you may say and whether
            you may say it. Do not start reading the diff until you have read them:
              1. .henokinho-spec/henokinho/review-style.md
              2. ${{ steps.spec.outputs.pack }}
              3. .henokinho-state/prior-review.md   (what you already said here,
                 what the author answered, and what the OTHER bots have already
                 said — read it before the diff, it decides what this pass is
                 even allowed to do)

            THIS FILE DELIBERATELY DOES NOT REPEAT WHAT THOSE FILES SAY. It does
            not restate a rule, summarise a section or paraphrase a lens. A rule
            written down in two places diverges the first day someone edits one of
            them, and the copy buried in a workflow is the one nobody remembers to
            update — it has already happened here twice. What follows is only what
            review-style.md cannot know: which pass this is, which commands to
            run, and where the files are.

            THESE SECTIONS OF review-style.md GOVERN THIS RUN. Read them as
            binding, not as advice:
              * §0 overrides every lens and everything in this file.
              * §4 (Convergence — the closed ledger) decides what you are allowed
                to raise at all on this pass. You are on pass
                ${{ steps.prior.outputs.pass_index }}. If that is not pass 1, the
                ledger is closed and §4 says what that means; the narrow exception
                it allows is scoped to lines added since
                ${{ steps.prior.outputs.last_sha }}, which you get with
                `git diff ${{ steps.prior.outputs.last_sha }}..HEAD`. HEAD
                UNCHANGED SINCE THAT PASS is
                ${{ steps.prior.outputs.head_unchanged }}; if that is true, no
                lines were added and the exception cannot apply at all.
              * §3 (The review body, and the verdict) decides how the body
                reads and what the verdict is.
              * §5 is the calibration. §8 is the list of filters a finding must
                pass before you open it, including the rule on what the other bots
                already said. Both are binding too.

            **Zero findings is a good outcome, not a failure.**

            ONE RULE IS REPEATED HERE ON PURPOSE, AND IT IS THE ONLY ONE:
            **YOU NEVER APPROVE AND YOU NEVER BLOCK.** `--approve` and
            `--request-changes` are not yours to give, on any pass, whatever you
            found. `--comment` is the only verdict you ever post; approving is
            @${{ inputs.reviewer_login }}'s call and his alone.
            §3 of review-style.md says this too, and says why. It is duplicated
            here against the rule that this file repeats nothing, for two reasons
            worth the exception: it is the one rule whose violation cannot be
            taken back — an approval shows on the PR at once and someone may merge
            on the strength of it — and `gh pr review` will accept the other two
            flags from you if you type them. Nothing in this workflow stops you.
            This line is the whole of it.

            THIS REPO'S AGENT GUIDELINES: ${{ steps.spec.outputs.guidelines }}
            (${{ steps.spec.outputs.guidelines_lines }} lines, mode
            `${{ steps.spec.outputs.guidelines_mode }}`). How you read it depends
            on that mode, and getting this wrong costs you the review:
              * `full`   — read the whole file before the diff, like the three above.
              * `search` — the file is too large to read before reviewing. Do NOT
                read it in full and do NOT page through it. Get the diff first,
                then Grep that file for the conventions bearing on the files this
                diff touches — the directories involved, the symbols changed, the
                layer they live in — and read only those sections.
              * `none`   — there is no such file. Review from the lens pack alone.

            Then: `gh pr view ${{ github.event.pull_request.number }}` for the
            stated intent, then `gh pr diff`. The PR head is checked out in the
            working directory. Open a specific changed file ONLY to verify a
            finding you already suspect. Do not explore the repo for its own sake,
            do not re-read files, and do not call tools "just to be thorough" once
            you have enough signal to judge.

            PRIOR PASSES — .henokinho-state/prior-review.md carries two things
            this workflow assembled for you:
              * the points YOU raised on earlier passes, each with the author's
                reply if there was one, and the exact
                `gh api … /comments/<id>/replies` command to answer on that same
                thread. Use it: never open a second thread for a point already
                there.
              * a section listing what the OTHER bots have already raised, with
                file and line. §8 of review-style.md says what you may do with
                that section. Follow it exactly.

            HOW TO POST:
            - Post each finding as an inline comment anchored to its line, via
              mcp__github_inline_comment__create_inline_comment with
              confirmed: true, in a batch toward the end.
            - Then exactly one review verdict, written as §3 requires:

              gh pr review ${{ github.event.pull_request.number }} --comment --body "..."
            - Never merge, never push commits, never edit files, never resolve
              threads, never comment on `DS-PROJECT/` as if it were yours to change.
            - Then stop.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob"

      - name: Render cost summary
        id: cost
        if: always() && hashFiles('.github/scripts/claude_cost.py') != ''
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_COST_OUT: ${{ runner.temp }}/claude-cost.json
          CLAUDE_COST_PR_FOOTER: ${{ runner.temp }}/claude-cost-pr-footer.md
          CLAUDE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_REVIEW_TIER: henokinho
        run: python3 .github/scripts/claude_cost.py

      - name: Upload cost stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henokinho-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-cost.json
          retention-days: 14
          if-no-files-found: ignore
