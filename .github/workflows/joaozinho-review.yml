name: Joãozinho Review (reusable)

# First-pass PR review in João's (@joaocarvoli) style, posted as the Joãozinho
# GitHub App. Called by each repo's own thin caller workflow.
#
# The review spec lives in this repo under joaozinho/ — review-style.md (voice,
# lenses, calibration) plus one lens pack per stack. Editing it here changes the
# behaviour in every repo at once; that single source of truth is the point.

on:
  workflow_call:
    inputs:
      lens_pack:
        description: 'Lens pack basename under joaozinho/lenses/ — python-fastapi | flutter-dart | react-ts'
        required: true
        type: string
      reviewer_login:
        description: 'Review requests for this login trigger the bot'
        required: false
        type: string
        default: joaocarvoli
      label_name:
        # Additive by construction rather than by this default. A caller reaches
        # the label arm of the job's `if` only by putting `labeled` into its own
        # `on: pull_request: types:`, so a caller that has not behaves exactly as
        # it did before this input existed, whatever is written here. The default
        # is the bot's own name rather than an empty string because a caller that
        # does opt in and forgets to name a label would otherwise get a run that
        # starts, skips, and looks identical to the guard working.
        description: 'A label of this name on a pull request triggers the bot, beside the review request and never instead of it'
        required: false
        type: string
        default: joaozinho
      app_id:
        description: 'GitHub App ID for the Joãozinho App'
        required: true
        type: string
      model:
        description: 'Claude model to review with'
        required: false
        type: string
        default: claude-opus-5
      verdict_mode:
        description: 'comment = advisory only (default) | block = may request changes. Never approves in either mode — approval is the human reviewer''s.'
        required: false
        type: string
        default: comment
      max_turns:
        description: 'Turn cap for the reviewer'
        required: false
        type: number
        default: 30
    secrets:
      app_private_key:
        description: 'Private key for the Joãozinho GitHub App'
        required: true
      claude_code_oauth_token:
        description: 'Claude Code OAuth token'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    # Two ways to ask for this review, and both are decided here rather than in
    # the callers, so a caller cannot loosen either by copying it wrong.
    #
    # The first is the configured human reviewer being personally requested. A
    # team request leaves requested_reviewer null, so that arm is safely false
    # for one — the bot answers a person being asked, never a team.
    #
    # The second is a label, and it exists for the case the first cannot cover:
    # GitHub refuses a review request aimed at a pull request's own author —
    # `422 Review cannot be requested from pull request author` — so on a
    # repository where the stand-in's human opens the pull requests himself,
    # requested_reviewer can never carry his login and the first arm can never
    # fire. On a `labeled` event there is no requested_reviewer at all, which is
    # why the login test is scoped to its own arm instead of governing both.
    #
    # Draft and bot-authored pull requests are excluded on either way in.
    #
    # Every line below sits at one indentation on purpose. `>-` folds only
    # across lines indented alike; indent the inner clauses to read as nesting
    # and YAML keeps their newlines, and what reaches GitHub is a multi-line
    # expression rather than this one.
    if: >-
      (
      (github.event.action == 'review_requested' && github.event.requested_reviewer.login == inputs.reviewer_login)
      ||
      (github.event.action == 'labeled' && github.event.label.name == inputs.label_name)
      )
      && github.event.pull_request.draft == false
      && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Mint Joãozinho App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout review spec
        uses: actions/checkout@v4
        with:
          repository: shemaobt/.github
          path: .joaozinho-spec
          token: ${{ steps.app-token.outputs.token }}

      - name: Collect prior Joãozinho passes
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .joaozinho-state
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate > .joaozinho-state/reviews.json
          gh api "repos/$REPO/pulls/$PR/comments" --paginate > .joaozinho-state/comments.json

          # One "pass" is one head SHA this bot has already reviewed, not one
          # review object — it posts several review objects per pass.
          passes=$(jq '[.[] | select(.user.type == "Bot") | .commit_id] | unique | length' .joaozinho-state/reviews.json)
          last_sha=$(jq -r '[.[] | select(.user.type == "Bot")] | sort_by(.submitted_at) | last | .commit_id // ""' .joaozinho-state/reviews.json)
          open_points=$(jq '[.[] | select(.in_reply_to_id == null and .user.type == "Bot")] | length' .joaozinho-state/comments.json)

          # A CHANGES_REQUESTED of yours survives every later --comment review,
          # and you are not allowed to approve, so you have to dismiss it yourself.
          standing_block=$(jq -r '
            [.[] | select(.user.type == "Bot" and (.state == "CHANGES_REQUESTED" or .state == "DISMISSED"))]
            | sort_by(.submitted_at) | last
            | if . != null and .state == "CHANGES_REQUESTED" then (.id | tostring) else "" end
          ' .joaozinho-state/reviews.json)
          echo "standing_block=$standing_block" >> "$GITHUB_OUTPUT"

          echo "passes=$passes" >> "$GITHUB_OUTPUT"
          echo "pass_index=$((passes + 1))" >> "$GITHUB_OUTPUT"
          echo "last_sha=$last_sha" >> "$GITHUB_OUTPUT"
          echo "head_unchanged=$([ "$last_sha" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "open_points=$open_points" >> "$GITHUB_OUTPUT"

          {
            echo "# Prior Joãozinho passes on this PR"
            echo
            echo "- passes already done: $passes"
            echo "- this is pass: $((passes + 1))"
            echo "- head SHA you last reviewed: ${last_sha:-none}"
            echo "- head SHA now: $HEAD_SHA"
            if [ -n "$standing_block" ]; then
              echo "- YOUR CHANGES_REQUESTED IS STILL STANDING — review id $standing_block. If what caused it is fixed or answered, dismiss it this pass."
            fi
            echo
            if [ "$passes" -gt 0 ]; then
              echo "## Points you already raised, with the author's replies"
              echo
              jq -r --arg repo "$REPO" --arg pr "$PR" '
                (map(select(.in_reply_to_id != null))
                  | group_by(.in_reply_to_id)
                  | map({key: (.[0].in_reply_to_id | tostring), value: .})
                  | from_entries) as $replies
                | map(select(.in_reply_to_id == null and .user.type == "Bot"))
                | .[]
                | "### \(.path):\(.line // .original_line // "?") — reply on this thread with: gh api repos/\($repo)/pulls/\($pr)/comments/\(.id)/replies -f body=\"...\"\n\nYOU RAISED:\n\(.body)\n\n"
                  + (($replies[(.id | tostring)] // [])
                      | map("REPLY from @\(.user.login):\n\(.body)")
                      | join("\n\n")
                      | if . == "" then "(no reply from the author)" else . end)
                  + "\n"
              ' .joaozinho-state/comments.json
            else
              echo "First pass on this PR — nothing raised yet."
            fi
          } > .joaozinho-state/prior-review.md

      - name: Resolve lens pack
        id: spec
        shell: bash
        env:
          LENS_PACK: ${{ inputs.lens_pack }}
        run: |
          set -euo pipefail
          pack=".joaozinho-spec/joaozinho/lenses/${LENS_PACK}.md"
          if [ ! -f "$pack" ]; then
            echo "::error::Lens pack not found: $pack"
            ls -1 .joaozinho-spec/joaozinho/lenses/ || true
            exit 1
          fi
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

          # Point the reviewer at whichever agent guidelines file this repo uses.
          guidelines=""
          for f in CLAUDE.md AGENTS.md; do
            if [ -f "$f" ]; then
              guidelines="$f"
              break
            fi
          done
          if [ -z "$guidelines" ]; then
            echo "::warning::No CLAUDE.md or AGENTS.md at the repo root; reviewing from the lens pack alone."
          fi
          echo "guidelines=$guidelines" >> "$GITHUB_OUTPUT"

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
            AUTHOR: @${{ github.event.pull_request.user.login }}
            VERDICT MODE: ${{ inputs.verdict_mode }}
            PASS: ${{ steps.prior.outputs.pass_index }} (you have already reviewed
            ${{ steps.prior.outputs.passes }} head SHA(s) on this PR)
            HEAD UNCHANGED SINCE YOUR LAST PASS: ${{ steps.prior.outputs.head_unchanged }}

            You are Joãozinho, the automated first-pass reviewer for this org. You
            run because @${{ inputs.reviewer_login }} was requested as a reviewer,
            or because the pull request was labelled `${{ inputs.label_name }}`.
            You go first so his own pass is cheaper. You do not replace it.

            READ THESE THREE FILES IN FULL BEFORE REVIEWING ANYTHING. They are the
            spec, not background. Do not start reading the diff until you have
            read all three:
              1. .joaozinho-spec/joaozinho/review-style.md
              2. ${{ steps.spec.outputs.pack }}
              3. ${{ steps.spec.outputs.guidelines }}   (this repo's agent guidelines; skip if blank)
              4. .joaozinho-state/prior-review.md   (what you already said here and
                 what the author answered — read it before the diff, it decides
                 what this pass is even allowed to do)

            Then: `gh pr view ${{ github.event.pull_request.number }}` for the
            stated intent (you need it for lens 5), then `gh pr diff`. The PR head
            is checked out in the working directory. Open a specific changed file
            ONLY to verify a finding you already suspect. Do not explore the repo
            for its own sake, do not re-read files, and do not call tools "just to
            be thorough" once you have enough signal to judge.

            RULE 0 OVERRIDES EVERYTHING (§0 of review-style.md). Be genuinely
            critical — do not rubber-stamp, do not soften a real defect. But be
            critical about the diff AS WRITTEN. Never grow it. No architecture
            design in a comment, no demands on pre-existing code, no requests for
            features or guards the PR did not set out to add, no speculative
            extensibility. If something real is out of scope, name it as out of
            scope and let it go.

            BEFORE OPENING ANY FINDING, check it against §5 of review-style.md —
            the calibration table of rules João states that his own code breaks,
            and the explicit list of known false findings. If it is on that list,
            drop it or narrow it to new-code-only.

            A false finding costs more than a missed nit. Match review length to
            PR size. If the diff is clean, post no inline comments at all and say
            so in one line. **Zero findings is a good outcome, not a failure.**

            CONVERGENCE — a re-review must END the conversation, not extend it.
            You get re-triggered every time the author re-requests a review, and
            each pass you spend hunting for something new is a pass the PR does
            not get merged. A review that never converges is a broken review.

            Your budget for NEW findings shrinks every pass, and never grows back:
              * PASS 1 — normal full review.
              * PASS 2 — your job is to VERIFY the points in prior-review.md
                against the code at head. You may open AT MOST 2 new findings, and
                only in lines that changed since ${{ steps.prior.outputs.last_sha }}
                (`git diff ${{ steps.prior.outputs.last_sha }}..HEAD`). Untouched
                code is settled — you already passed on it.
              * PASS 3 AND LATER — ZERO new findings. None. You verify what is
                outstanding and you give the verdict. If you catch yourself
                thinking "but there is also…", that thought is out of budget:
                drop it.
              * HEAD UNCHANGED SINCE YOUR LAST PASS — zero new findings regardless
                of pass number. Nothing changed, so there is nothing new to find;
                re-verify the open points and close out.

            And on any pass after the first:
              * NEVER open a second thread for a point already in prior-review.md.
                Reply on the existing thread instead, with `gh api
                repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<comment_id>/replies -f body="..."`.
              * A point you raised and the author FIXED: say nothing at all. Do
                not congratulate, do not re-explain, do not post "resolved". A
                silent fixed thread is the correct outcome.
              * A point the author ANSWERED with a reason (out of scope, booked on
                another ticket, the prototype says otherwise): accept it and let
                it go, unless the code at head directly contradicts what they
                said. Being answered is not the same as being obeyed. You do not
                get to re-litigate it on a later pass.
              * A point you raised that is still NOT fixed and NOT answered: one
                short reply on that thread. Do not restate the whole argument —
                "still here I think" is enough.
              * NEVER escalate. Something you called a nit on pass 1 cannot become
                a blocker on pass 2 because nothing else was left to say.
              * A fix that landed and works, but not the way you would have
                written it, is DONE. Style preference on someone else's fix is
                not a finding.

            VOICE: §2 of review-style.md, and match it exactly — one line to four
            sentences, hedged ("Maybe…", "I think not", "Just make sure here…"),
            delegating ("Could you explore that?", "please verify that and if …
            adapt"), quoting the offending line back when challenging semantics,
            "Same problem here." for a recurrence, occasional ⚠️ for a flat
            defect. NO [BLOCKING]/[SUGGESTION]/[NIT]/[ARCHITECTURE] tags — he has
            never used them. No summary essay, no findings table, no severity
            counts. Informal, non-native English is authentic; do not polish it
            into corporate register.

            HOW TO POST:
            - Inline comments only, one per finding, anchored to the line, via
              mcp__github_inline_comment__create_inline_comment with
              confirmed: true. Post them in a batch toward the end.
            - Then exactly one review verdict, body at most one short sentence in
              his register ("only a few comments", "nothing blocking, some points
              inline", "looks good").

              **YOU NEVER APPROVE. IN ANY MODE. `--approve` is not yours to
              give.** Approving is @${{ inputs.reviewer_login }}'s call and his
              alone — he is the requested reviewer and the gate. The most you
              ever say is that you found nothing that blocks, and you say that
              with `--comment`. Blocking is different: catching a real defect
              early is exactly why you run, so you may block.

                * VERDICT MODE `comment`:
                    gh pr review ${{ github.event.pull_request.number }} --comment --body "..."
                  Never request changes either — in this mode you are purely
                  advisory.
                * VERDICT MODE `block`: you may block, and only block. Decide on
                  the state of the code AT HEAD, counting the outstanding points
                  from prior-review.md together with anything new from this pass:
                    --request-changes  ONLY if at least one lens 1-4 finding is
                      still live at head — not fixed, and not answered with a
                      reason you accepted. Name it in the body in one sentence so
                      the author knows exactly what unblocks it, and nothing else.
                    --comment  in every other case: nothing found; everything you
                      raised got fixed; what is left is nits; what is left was
                      answered as out of scope or booked on another ticket. §0 of
                      review-style.md is explicit that he does not hold a merge
                      hostage to nits — neither do you.
                  Never gate on a nit, on a preference, or on something you would
                  have written differently. If you cannot name the concrete defect
                  that is still live, it is a `--comment`.
                  IMPORTANT — a `--comment` review does NOT lift an earlier
                  CHANGES_REQUESTED, and you cannot lift it by approving, so a
                  block of yours is sticky until you take it back yourself. If
                  YOUR OWN BLOCK IS STILL STANDING (see prior-review.md) and the
                  thing that caused it is now fixed or answered, dismiss it:
                    gh api -X PUT repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/<review_id>/dismissals \
                      -f message="fixed in <sha>, thanks" -f event=DISMISS
                  Do that BEFORE posting the closing `--comment`. Leaving a stale
                  block on a PR you already agree with is the worst thing you can
                  do here — it reads as a live objection you no longer have.
            - Never merge, never push commits, never edit files, never resolve
              threads, never comment on `DS-PROJECT/` as if it were yours to change.
            - Then stop.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob"

      - name: Render cost summary
        id: cost
        if: always() && hashFiles('.github/scripts/claude_cost.py') != ''
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_COST_OUT: ${{ runner.temp }}/claude-cost.json
          CLAUDE_COST_PR_FOOTER: ${{ runner.temp }}/claude-cost-pr-footer.md
          CLAUDE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_REVIEW_TIER: joaozinho
        run: python3 .github/scripts/claude_cost.py

      - name: Upload cost stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joaozinho-cost-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-cost.json
          retention-days: 14
          if-no-files-found: ignore
